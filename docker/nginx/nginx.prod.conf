# Configuración de Nginx como Proxy Inverso
# Sirve el frontend Angular y redirige peticiones /api al backend Symfony

server {
    listen 80;
    server_name localhost;
    
    # Archivos de log
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    
    # Tamaño máximo de carga
    client_max_body_size 50M;

    # Backend API - Proxy inverso a Symfony
    location /api {
        root /var/www/backend/public;
        
        # Intentar servir el archivo o pasar a index.php
        try_files $uri /index.php$is_args$args;
    }
    
    # Procesar archivos PHP del backend
    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Aumentar timeouts para operaciones largas
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        
        internal;
    }
    
    # No permitir acceso directo a otros archivos PHP
    location ~ \.php$ {
        return 404;
    }

    # Denegar acceso a archivos .git
    location ~ /\.git {
        deny all;
    }

    # Frontend Angular (aplicación compilada)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
