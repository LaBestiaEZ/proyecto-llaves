services:
  # Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: llaves-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llaves_db}
      POSTGRES_USER: ${POSTGRES_USER:-llaves_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llaves_password}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - llaves-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llaves_user} -d ${POSTGRES_DB:-llaves_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Symfony (PHP-FPM) - Modo Desarrollo
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: llaves-backend-dev
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/entrypoint-dev.sh:/usr/local/bin/entrypoint.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-llaves_user}:${POSTGRES_PASSWORD:-llaves_password}@db:5432/${POSTGRES_DB:-llaves_db}?serverVersion=16&charset=utf8"
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: ${APP_SECRET:-dev_secret_change_in_production}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-dev_password}
      JWT_TTL: ${JWT_TTL:-3600}
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - llaves-network-dev

  # Nginx - Solo para Backend API
  nginx-backend:
    image: nginx:alpine
    container_name: llaves-nginx-dev
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - llaves-network-dev

  # Frontend Angular - Modo Desarrollo con Hot Reload
  frontend:
    image: node:20-alpine
    container_name: llaves-frontend-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --poll 2000"
    networks:
      - llaves-network-dev
    stdin_open: true
    tty: true

volumes:
  postgres_data_dev:
    driver: local

networks:
  llaves-network-dev:
    driver: bridge
